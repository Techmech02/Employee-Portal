<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Employee Portal - Login</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>
    <nav class="navbar">
        <div class="navbar-brand">
            <span class="icon">Employee Portal</span>
        </div>
        <div class="navbar-links">
            <h:form>
                <h:commandButton value="Register Employee"
                                 action="index?faces-redirect=true"
                                 styleClass="nav-btn"/>
            </h:form>
            <h:form>
                <h:commandButton value="View All Employees"
                                 action="employees?faces-redirect=true"
                                 styleClass="nav-btn"/>
            </h:form>
        </div>
    </nav>

    <div class="login-container">
        <div class="card login-card">
            <h2 class="card-title">Employee Login</h2>

            <h:form id="loginForm">
                <div class="messages">
                    <h:messages layout="list"
                                infoClass="msg-info"
                                warnClass="msg-warn"
                                errorClass="msg-error"/>
                </div>

                <div class="form-grid login-grid">
                    <div class="form-group full-width">
                        <label for="employeeId">Employee ID</label>
                        <h:inputText id="employeeId"
                                     value="#{loginBean.employeeId}"
                                     required="true"
                                     requiredMessage="Employee ID is required."
                                     placeholder="e.g. EMP-001"/>
                        <h:message for="employeeId" styleClass="msg-error"/>
                    </div>

                    <div class="form-group full-width">
                        <label for="email">Email Address</label>
                        <h:inputText id="email"
                                     value="#{loginBean.email}"
                                     placeholder="name@company.com"/>
                        <h:message for="email" styleClass="msg-error"/>
                    </div>

                    <div class="form-actions">
                        <h:commandButton value="Login"
                                         action="#{loginBean.login}"
                                         styleClass="btn btn-success"/>
                        <h:commandButton value="Login with ID Only"
                                         action="#{loginBean.loginWithEmployeeIdOnly}"
                                         styleClass="btn btn-outline"/>
                    </div>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
